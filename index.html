<!-- desk-build:19 chart-hold -->
<script>
// set the theme before first paint; Dark / Dim / Light (legacy auto/light migrated once)
(function () { try {
  if (localStorage.getItem("desk_theme_ver") !== "3") {
    const old = localStorage.getItem("desk_theme");
    if (old === "light") localStorage.setItem("desk_theme", "dim");
    else if (old === "auto" || !old) {
      const h = +new Intl.DateTimeFormat("en-GB", { hour: "2-digit", hourCycle: "h23", timeZone: "Europe/Amsterdam" }).format(new Date());
      localStorage.setItem("desk_theme", (h >= 22 || h < 7) ? "dim" : "dark");
    }
    localStorage.setItem("desk_theme_ver", "3");
  }
  const p = localStorage.getItem("desk_theme") || "dark";
  document.documentElement.dataset.theme = (p === "dim" || p === "light" || p === "dark") ? p : "dark";
} catch (e) {} })();
</script>

<style>
:root{--bg:#07090c;--card:#11151b;--card2:#171c24;--line:#232a35;--txt:#e9edf2;--mut:#8a94a3;--grn:#2fd27a;--red:#ff5468;--amb:#ffb648;--blu:#5aa9ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:.35rem;padding:.55rem .65rem;background:rgba(7,9,12,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex-wrap:nowrap}
header h1{margin:0;font-size:1rem;letter-spacing:.05em;flex:none}
header .upd{margin-left:auto;color:var(--mut);font-size:.68rem;text-align:right;line-height:1.15;flex:none;max-width:4.6rem}
.hdr-coin{display:inline-flex;gap:.22rem;align-items:center;flex:none}
.hdr-coin[hidden]{display:none!important}
.hdr-btn{font-size:.65rem;font-weight:700;padding:.16rem .4rem;border-radius:8px;border:1px solid var(--line);color:var(--txt);text-decoration:none;background:var(--card2);white-space:nowrap;line-height:1.2}
.hdr-btn[aria-disabled="true"]{opacity:.35;pointer-events:none}
.live-chart{position:relative;margin:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card2);min-height:340px;touch-action:pan-x pan-y pinch-zoom;-webkit-user-select:none;user-select:none}
.live-chart iframe{display:block;width:100%;height:340px;border:0;background:transparent;touch-action:auto;pointer-events:auto}
.chart-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;background:var(--card2);color:var(--mut);font-size:.85rem;font-weight:600;pointer-events:none}
.live-chart.is-ready .chart-loading,.live-chart.is-failed .chart-loading{display:none}
.chart-fallback{padding:.55rem .7rem;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.chart-fallback[hidden]{display:none!important}
.chart-toolbar{display:flex;align-items:center;gap:.4rem;padding:.35rem .55rem;border-bottom:1px solid var(--line);background:var(--card)}
.chart-toolbar .btn{font-size:.72rem;padding:.28rem .55rem}
.chart-fs{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.chart-fs[hidden]{display:none!important}
.chart-fs .chart-fs-bar{display:flex;align-items:center;gap:.5rem;padding:.5rem .7rem;background:#111;color:#fff;flex:none}
.chart-fs .chart-fs-bar .btn{background:#fff;color:#111}
.chart-fs .chart-fs-body{flex:1;min-height:0;position:relative}
.chart-fs .chart-fs-body .live-chart,.chart-fs .chart-fs-body .mc-chart-wrap{height:100%;margin:0;border:0;border-radius:0;min-height:0}
.chart-fs .chart-fs-body .live-chart{height:100%}
.chart-fs .chart-fs-body iframe{height:100%!important;min-height:100%}
#chartPark{position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;pointer-events:none}
.chart-miss{padding:.7rem .8rem;text-align:center;border:1px dashed var(--line);border-radius:12px;margin:0 0 .75rem}
.mc-chart-wrap{margin:0 0 .75rem;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card2)}
.mc-chart{width:100%;height:320px}
.dex-info{margin:.55rem 0 .35rem;padding:.55rem .6rem;border:1px solid var(--line);border-radius:12px;background:var(--card2)}
.dex-info .di-pair{font-weight:800;font-size:1rem}
.dex-info .di-meta{font-size:.78rem;color:var(--mut);margin:.15rem 0 .35rem}
.dex-info .di-links{display:flex;flex-wrap:wrap;gap:.35rem;margin:.2rem 0 .45rem}
.dex-info .di-links a{font-size:.72rem;font-weight:700;padding:.15rem .5rem;border-radius:99px;border:1px solid var(--line);color:var(--txt);text-decoration:none;background:var(--card)}
.dex-info .di-tabs{display:flex;gap:.3rem;margin:.35rem 0 .45rem}
.dex-info .di-tab{flex:1;text-align:center;font-size:.72rem;font-weight:800;padding:.35rem .2rem;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer}
.dex-info .di-tab.on{background:var(--card);color:var(--txt);border-color:var(--txt)}
.dex-info .di-tab .chg{display:block;font-size:.78rem;margin-top:.1rem}
.dex-info .di-grid{display:grid;grid-template-columns:1fr 1fr;gap:.35rem .6rem;font-size:.8rem}
.dex-info .di-grid b{display:block;font-size:.95rem}
.dex-info .di-bar{height:6px;border-radius:99px;background:rgba(127,127,127,.2);overflow:hidden;display:flex;margin-top:.25rem}
.dex-info .di-bar i{display:block;height:100%}
.dex-info .di-bar i.b{background:var(--grn)}.dex-info .di-bar i.s{background:var(--red)}
.mc-strip{padding:.45rem .55rem;border-top:1px solid var(--line)}
.mc-lvs{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.3rem}
.mc-lv{font-size:.68rem;font-weight:700;padding:.14rem .45rem;border-radius:99px;border:1px dashed var(--line);color:var(--mut);background:transparent}
.mc-lv.fired{border-style:solid;border-color:var(--red);color:var(--red);background:rgba(255,84,104,.08)}
html[data-theme="light"] .mc-lv.fired,html[data-theme="dim"] .mc-lv.fired{background:#fff1f2}
.mc-alerts{display:flex;flex-wrap:wrap;gap:.3rem;padding:.45rem .55rem;border-top:1px solid var(--line)}
.mc-alerts .chip{font-size:.68rem;font-weight:600;padding:.15rem .45rem;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.mc-alerts .chip.fire{color:var(--red);border-color:var(--red);background:transparent}
.hdr-bell{position:relative;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:99px;font-size:.72rem;padding:.18rem .55rem;cursor:pointer;flex:none}
.hdr-bell .dot{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:.62rem;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
.hdr-bell .dot[hidden]{display:none!important}
.alert-item{padding:.65rem 0;border-bottom:1px solid var(--line)}.alert-item:last-child{border:0}
.alert-item.unread{background:rgba(255,84,104,.06)}
html[data-theme="light"] .alert-item.unread,html[data-theme="dim"] .alert-item.unread{background:#fff1f2}
.badge{font-size:.7rem;font-weight:700;padding:.15rem .5rem;border-radius:99px;letter-spacing:.06em}
.b-paper{background:#2a2410;color:var(--amb);border:1px solid #5a4614}.b-live{background:#2a1015;color:var(--red);border:1px solid #5a1a24}
main{max-width:1280px;margin:0 auto;padding:1rem}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem;margin-bottom:.9rem}
.mut{color:var(--mut)}.sm{font-size:.82rem}.grn{color:var(--grn)}.red{color:var(--red)}.amb{color:var(--amb)}
.big{font-size:2rem;font-weight:700;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:.6rem}.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.kv{background:var(--card2);border-radius:12px;padding:.6rem .7rem}.kv b{display:block;font-size:1.05rem}
.banner{border-radius:14px;padding:.75rem .9rem;margin-bottom:.7rem;font-weight:600}
.bn-red{background:#2a0f15;border:1px solid #5c1d29;color:#ffb3bd}.bn-amb{background:#2a200d;border:1px solid #5a4614;color:#ffd59a}
.bn-grn{background:#0d2219;border:1px solid #1b4a33;color:#9ff0c4}.bn-blu{background:#0e1a2a;border:1px solid #1e3a5c;color:#b5d5ff}
ul.plain{list-style:none;margin:0;padding:0}ul.plain li{padding:.45rem 0;border-bottom:1px solid var(--line)}ul.plain li:last-child{border:0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
/* auditor */
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.8rem}
.counter{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem;text-align:center}
.counter b{display:block;font-size:1.5rem}.counter span{font-size:.75rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.coin{display:flex;align-items:center;gap:.8rem}
.logo{width:54px;height:54px;border-radius:50%;flex:none;background:linear-gradient(135deg,#2b3646,#18202b);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;overflow:hidden;border:2px solid var(--line)}
.logo img{width:100%;height:100%;object-fit:cover}
.pill{margin-left:auto;font-size:.78rem;font-weight:700;padding:.3rem .7rem;border-radius:99px}
.p-ok{background:#0f2a1d;color:var(--grn);border:1px solid #1d5a3b}.p-bad{background:#2c1016;color:var(--red);border:1px solid #63202d}
.checks{margin-top:.8rem}
.chk{display:flex;align-items:center;gap:.7rem;padding:.62rem .2rem;border-bottom:1px solid var(--line);opacity:0;animation:pop .35s ease forwards}
.chk:last-child{border:0}
@keyframes pop{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.ic{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem}
.ic-ok{background:#123524;color:var(--grn)}.ic-bad{background:#3a121a;color:var(--red)}.ic-na{background:#222a35;color:var(--mut)}
.chk .lab{font-weight:600;font-size:.92rem}.chk .val{font-size:.82rem;color:var(--mut)}
.chk.bad .val{color:#ff9aa7}
.verdict{border-radius:14px;padding:.85rem 1rem;font-weight:700;margin-top:.8rem}
.v-ok{background:linear-gradient(90deg,#0f3523,#0d2219);border:1px solid #1d5a3b;color:#b6f5d1}
.v-bad{background:linear-gradient(90deg,#3a1019,#22090e);border:1px solid #63202d;color:#ffc2ca}
.nav2{display:flex;align-items:center;gap:.5rem;margin:.6rem 0 0}
.nav2 button{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:.45rem .8rem;font-size:1rem}
.dots{flex:1;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:#2c3542}.dots i.on{background:var(--txt)}.dots i.r{box-shadow:inset 0 0 0 2px var(--red)}.dots i.g{box-shadow:inset 0 0 0 2px var(--grn)}
.btn{display:inline-block;text-decoration:none;font-weight:700;font-size:.85rem;color:#06110b;background:var(--grn);padding:.45rem .8rem;border-radius:10px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.stage{font-size:.7rem;font-weight:700;padding:.12rem .45rem;border-radius:6px;text-transform:uppercase;letter-spacing:.05em;background:#222a35;color:var(--mut)}
.score{font-weight:700;font-size:.8rem;padding:.05rem .45rem;border-radius:.5rem}.score.hi{background:#123524;color:var(--grn)}.score.lo{background:#3a121a;color:var(--red)}
.parts{margin:.35rem 0 .2rem;display:grid;gap:.18rem}.part{display:grid;grid-template-columns:5.2rem 1fr 2rem;align-items:center;gap:.4rem;font-size:.72rem}
.part span{opacity:.75}.part i{display:block;height:.38rem;border-radius:.3rem;background:rgba(127,127,127,.22);overflow:hidden}
.part b{display:block;height:100%;background:var(--grn)}.part em{font-style:normal;text-align:right;opacity:.8}.blk{color:var(--red)}
.st-vetoed,.st-blocked,.st-rugged{background:#3a121a;color:var(--red)}
.st-watch{background:#10263f;color:#7cb7ff}.addrow{display:flex;gap:.5rem;margin:.55rem 0 .35rem;flex-wrap:wrap}
.addrow input{flex:1 1 14rem;min-width:0;font:inherit;font-size:.9rem;padding:.6rem .7rem;border-radius:.6rem;border:1px solid rgba(127,127,127,.35);background:transparent;color:inherit}
.addrow input:focus{outline:2px solid #3b82f6;outline-offset:1px}
.st-held,.st-approved,.st-cleared,.st-candidate{background:#123524;color:var(--grn)}.st-rejected,.st-reject{background:#3a121a;color:var(--red)}.st-wait,.st-scored{background:#2a2410;color:var(--amb)}
.item{padding:.75rem 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.lg{width:34px;height:34px;font-size:.75rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:rgba(10,13,17,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;min-width:0;background:none;border:0;color:var(--mut);padding:.55rem 0 .6rem;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--txt)}

/* Dim = former Light (soft grey). Light = true white page. Dark = default :root. */
html[data-theme="dim"]{--bg:#f4f6f9;--card:#ffffff;--card2:#eef1f5;--line:#dde3ea;--txt:#11161d;--mut:#5d6775;--grn:#0e9f56;--red:#d42c43;--amb:#a86a0c;--blu:#1f6fd1}

<script>
// Token comes from the URL fragment (#t=...), which browsers never send to the server.
// It is kept in localStorage and removed from the address bar.
(function () {
  const KEY = "desk_app_token";
  const m = location.hash.match(/(?:^#|&)t=([^&]+)/);
  if (m) {
    localStorage.setItem(KEY, decodeURIComponent(m[1]));
    history.replaceState(null, "", location.pathname + location.search);
  }
  window.deskToken = () => localStorage.getItem(KEY);
})();

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function gunzip(buf) {
  const ds = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Uint8Array(await new Response(ds).arrayBuffer());
}

async function decryptEnvelope(env, token) {
  if (![1, 2].includes(env.v) || env.alg !== "AES-256-GCM" || env.kdf !== "PBKDF2-SHA256") throw new Error("unsupported envelope");
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(token), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt: b64d(env.salt), iterations: env.iter },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  let pt = new Uint8Array(await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64d(env.iv), additionalData: new TextEncoder().encode(env.aad || "") },
    key, b64d(env.ct)));
  if (env.z === "gzip") pt = await gunzip(pt);
  return JSON.parse(new TextDecoder().decode(pt));
}

// GitHub Pages' CDN caches files for up to 10 min; the ?ts= query makes every fetch a fresh URL.
async function load(name) {
  const r = await fetch(`data/${name}.enc.json?ts=${Date.now()}`, { cache: "no-store" });
  if (!r.ok) throw new Error(`fetch ${name}: HTTP ${r.status}`);
  return decryptEnvelope(await r.json(), deskToken());
}


// ---------- theme: Dark / Dim / Light (legacy auto+old-light migrated in early paint to desk_theme_ver=3) ----------
const THEME_KEY = "desk_theme", THEMES = ["dark", "dim", "light"];
const THEME_LABEL = { dark: "Dark", dim: "Dim", light: "Light" };
const THEME_COLOR = { dark: "#07090c", dim: "#f4f6f9", light: "#ffffff" };
const LIGHT_FROM = 22, LIGHT_UNTIL = 7;   // kept for legacy autoTheme() tests / migration helpers
function amsterdamHour(d = new Date()) {
  try { return +new Intl.DateTimeFormat("en-GB", { hour: "2-digit", hourCycle: "h23", timeZone: "Europe/Amsterdam" }).format(d); }
  catch (e) { return d.getHours(); }      // fallback: device clock
}
function autoTheme(d) { const h = amsterdamHour(d); return (h >= LIGHT_FROM || h < LIGHT_UNTIL) ? "dim" : "dark"; }
function applyTheme() {
  let pref = localStorage.getItem(THEME_KEY);
  if (!THEMES.includes(pref)) pref = "dark";
  document.documentElement.dataset.theme = pref;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", THEME_COLOR[pref] || "#07090c");
  const b = document.getElementById("theme");
  if (b) b.textContent = THEME_LABEL[pref] || "Dark";
  // Never remount/reload the Dex iframe on theme change — zoom/pan must survive.
}

applyTheme();
document.getElementById("theme").onclick = () => {
  const cur = THEMES.includes(localStorage.getItem(THEME_KEY)) ? localStorage.getItem(THEME_KEY) : "dark";
  localStorage.setItem(THEME_KEY, THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length]); applyTheme();
};

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => (typeof u === "string" && /^https:\/\/[^\s"'<>]+$/.test(u)) ? u : null;
const usd = (x, sign) => x == null ? "–" : (sign && x > 0 ? "+" : x < 0 ? "-" : "") + "$" + Math.abs(x).toFixed(2);
const pct = x => x == null ? "–" : (x > 0 ? "+" : "") + x.toFixed(1) + "%";
const cls = x => x == null ? "" : x > 0 ? "grn" : x < 0 ? "red" : "";
const px = x => x == null ? "–" : "$" + (x >= 1 ? x.toFixed(4) : x.toPrecision(4));
const ago = ts => { const m = Math.max(0, (Date.now() / 1000 - ts) / 60); return m < 1 ? "just now" : m < 60 ? `${Math.round(m)} min ago` : m < 2880 ? `${(m / 60).toFixed(1)} h ago` : `${Math.round(m / 1440)} d ago`; };
const tm = ts => ts ? new Date(ts * 1000).toLocaleString([], { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "–";
const shortMint = m => m ? m.slice(0, 4) + "…" + m.slice(-4) : "";
const initials = s => esc((s || "?").replace(/[^A-Za-z0-9]/g, "").slice(0, 2).toUpperCase() || "?");
function logo(c, extra = "") {
  const u = safeUrl(c.image);
  return `<div class="logo ${extra}">${u ? `<img src="${esc(u)}" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.textContent='${initials(c.sym)}'">` : initials(c.sym)}</div>`;
}
// the link is used exactly as delivered in the feed (built by links.py on the box). FOMO has no sell-only deep link — same coin page.
const BUY_ALERT_KINDS = new Set(["buy", "follow", "follow_early"]);
const SELL_ALERT_KINDS = new Set(["take_profit", "stop_loss", "sell_half_2x", "watch"]);
function fomoBtn(link, ghost, label) {
  const u = safeUrl(link);
  const text = label || "Open on FOMO";
  return u ? `<a class="btn${ghost ? " ghost" : ""}" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${text}</a>` : "";
}
function plainFomoUrl(link) {
  // drop any referral query if a stale feed row still carries one (desk never adds r=)
  const u = safeUrl(link); if (!u) return "";
  try {
    const x = new URL(u);
    if (x.searchParams.has("r")) x.searchParams.delete("r");
    return x.toString();
  } catch (e) { return u; }
}
function buyFomoBtn(link, ghost) { return fomoBtn(plainFomoUrl(link), !!ghost, "Buy on FOMO"); }
function sellFomoBtn(link, ghost) { return fomoBtn(plainFomoUrl(link), !!ghost, "Sell on FOMO"); }
/** Prominent Buy / Sell shortcut on alerts (not MC-ladder alone for Buy; Sell covers ladder + TP/SL + rug-ish watch). */
function alertFomoBtn(a, ghost) {
  if (!a || !a.url || a.kind === "auto_paper" || a.kind === "bedtime" || a.kind === "desk_locked" || a.kind === "desk_paused" || a.kind === "danger_on" || a.kind === "danger_off") return "";
  const u = safeUrl(a.url);
  if (!u || u.indexOf("/coin?address=") < 0) return "";  // FOMO coin page shape from feed; host never hardcoded
  if (BUY_ALERT_KINDS.has(a.kind)) return buyFomoBtn(u, ghost);
  if (SELL_ALERT_KINDS.has(a.kind)) return sellFomoBtn(u, ghost);
  return fomoBtn(u, ghost);
}
/** Coin card: Buy + Sell side by side (same plain FOMO coin link). */
function buySellFomoPair(link) {
  const u = safeUrl(link);
  if (!u) return "";
  return `${buyFomoBtn(u, false)}${sellFomoBtn(u, true)}`;
}
// DexScreener chart: the feed's chart_url, used as given; only https://dexscreener.com/... is accepted
function chartBtn(u) {
  return (typeof u === "string" && /^https:\/\/dexscreener\.com\/[A-Za-z0-9\/]+$/.test(u))
    ? `<a class="btn ghost" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Open chart</a>` : "";
}
// Live DexScreener embed (custom Lightweight Charts / drawn thresholds = later; lch.js present but unused).
const MC_LEVELS = [3000000, 2000000, 1000000, 700000, 500000, 250000, 200000, 100000];
const ALERTS_SEEN_KEY = "desk_alerts_seen_ts";
const USE_LCH = false; // later: threshold lines drawn inside a custom MC chart
function chartTheme() { return document.documentElement.dataset.theme === "light" ? "light" : "dark"; }
function embedAddr(chartUrl, mint) {
  if (typeof chartUrl === "string") {
    const m = chartUrl.match(/^https:\/\/dexscreener\.com\/solana\/([1-9A-HJ-NP-Za-km-z]{32,44})$/);
    if (m) return m[1];
  }
  if (typeof mint === "string" && /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(mint)) return mint;
  return null;
}
function fmtMc(n) {
  n = +n; if (!Number.isFinite(n)) return "–";
  if (n >= 1e6) { const v = n / 1e6; return "$" + (Math.abs(v - Math.round(v)) < 1e-9 ? Math.round(v) : v.toFixed(1).replace(/\.0$/, "")) + "M"; }
  return "$" + Math.round(n / 1e3) + "K";
}
function tmAms(ts) {
  if (!ts) return "–";
  try { return new Date(ts * 1000).toLocaleString("en-GB", { timeZone: "Europe/Amsterdam", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }); }
  catch (e) { return tm(ts); }
}
function feedAlerts() {
  const fromDesk = (D && D.alerts) || [];
  const fromAg = (D && D.agentsx && D.agentsx.alerts) || [];
  // Prefer desk feed; fall back to agents. Dedup by id/ts+kind+mint.
  const src = fromDesk.length ? fromDesk : fromAg;
  const seen = new Set(); const out = [];
  for (const a of src) {
    const k = a.id != null ? "id:" + a.id : [a.ts, a.kind, a.mint, a.title].join("|");
    if (seen.has(k)) continue; seen.add(k); out.push(a);
  }
  return out.sort((a, b) => (b.ts || 0) - (a.ts || 0));
}
function mcWatchFor(mint) {
  const w = (D && (D.mc_watch || (D.agentsx && D.agentsx.mc_watch))) || {};
  return w[mint] || null;
}
function levelsNear(mc, firedMap) {
  // Levels "in range": seen/fired, or within ~3× of current MC (so tiny coins aren't crushed by $3M).
  const fired = firedMap || {};
  const cur = +mc || 0;
  return MC_LEVELS.filter(lv => {
    if (fired[lv] != null || fired[String(lv)] != null) return true;
    if (!cur) return lv <= 1_000_000; // default band when MC unknown
    return lv <= cur * 3 && lv >= cur / 8;
  });
}
function mcLevelStrip(mint) {
  const st = mcWatchFor(mint) || {};
  const live = (typeof LIVE !== "undefined" && LIVE[mint]) || {};
  const mc = st.last_mc != null ? st.last_mc : live.mcap;
  const fired = st.fired || {};
  const levels = levelsNear(mc, fired);
  if (!levels.length) return `<div class="mc-strip mut sm">No MC ladder levels in range${mc ? " · now " + fmtMc(mc) : ""}.</div>`;
  const chips = levels.map(lv => {
    const on = fired[lv] != null || fired[String(lv)] != null;
    return `<span class="mc-lv${on ? " fired" : ""}" title="${on ? "Fired" : "Watch"} ${fmtMc(lv)}">${fmtMc(lv)}${on ? " ✓" : ""}</span>`;
  }).join("");
  return `<div class="mc-strip"><span class="mut sm">MC ladder${mc ? " · now " + fmtMc(mc) : ""}</span><div class="mc-lvs">${chips}</div></div>`;
}
function coinAlertsHtml(mint, n) {
  n = n || 5;
  if (!mint) return "";
  const rows = feedAlerts().filter(a => a.mint === mint).slice(0, n);
  if (!rows.length) return `<div class="mc-alerts"><span class="chip mut">No alerts for this coin yet</span></div>`;
  return `<div class="mc-alerts">${rows.map(a => {
    const label = a.short || a.title || a.kind;
    const when = tmAms(a.ts).split(",").pop().trim(); // HH:MM Amsterdam
    const fire = a.level || /rug|RUGGED|danger/i.test(a.title || "") || a.kind === "danger_on";
    return `<span class="chip${fire ? " fire" : ""}">${esc(label)} · ${esc(when)}</span>`;
  }).join("")}</div>`;
}
// ---- Live Dex chart: keep the SAME iframe across feed refreshes (zoom/pan survive) ----
const CHART_HOLD_MS = 60000;
let chartHoldUntil = 0;
const chartParkMap = new Map(); // mint -> .mc-chart-wrap element (live iframe)
function chartHoldActive() { return Date.now() < chartHoldUntil; }
function noteChartTouch() { chartHoldUntil = Date.now() + CHART_HOLD_MS; }
function chartSlotHtml(mint) {
  return `<div class="chart-slot" data-chart-slot="${esc(mint || "")}"></div>`;
}
function liveChartHtml(chartUrl, mint) {
  // DexScreener embed. Eager src (no loading=lazy — blank on Android standalone PWA).
  // referrerpolicy not no-referrer: Dex embed often stays blank without a referrer.
  const addr = embedAddr(chartUrl, mint);
  const th = chartTheme();
  const open = chartBtn(chartUrl) || (addr ? chartBtn("https://dexscreener.com/solana/" + addr) : "");
  if (!addr) {
    return `<div class="mc-chart-wrap" data-mint="${esc(mint || "")}"><div class="chart-toolbar"><button type="button" class="btn ghost chart-fs-btn" disabled>⛶ Full screen</button></div>
      <div class="chart-miss mut sm">Chart unavailable – Open chart</div>
      <div class="chart-fallback">${open}</div></div>`;
  }
  const src = `https://dexscreener.com/solana/${addr}?embed=1&theme=${th}&chartTheme=${th}&info=0&trades=0&chartLeftToolbar=0&interval=5`;
  return `<div class="mc-chart-wrap" data-mint="${esc(mint || "")}" data-chart-src="${esc(src)}">

// The CA is checked here first: base58 alphabet, 32-44 chars, decodes to exactly 32 bytes.
const BOT = "Alltradein_bot", B58A = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function b58len(s) {
  const b = [0];
  for (const ch of s) {
    let carry = B58A.indexOf(ch); if (carry < 0) return -1;
    for (let i = 0; i < b.length; i++) { carry += b[i] * 58; b[i] = carry & 255; carry >>= 8; }
    while (carry) { b.push(carry & 255); carry >>= 8; }
  }
  while (b.length && b[b.length - 1] === 0) b.pop();
  let z = 0; for (const ch of s) { if (ch === "1") z++; else break; }
  return z + b.length;
}
function validCA(s) { return typeof s === "string" && /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(s) && b58len(s) === 32; }
function addCoinLink(ca) { ca = String(ca ?? "").trim(); return validCA(ca) ? `https://t.me/${BOT}?start=add_${ca}` : null; }

function eqSvg(pts) {
  if (!pts || pts.length < 2) return `<p class="sm mut">Curve starts after the first copied sells.</p>`;
  const W = 320, H = 90, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]).concat([0]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1, y0 = Math.min(...ys), y1 = Math.max(...ys);
  const X = t => ((t - x0) / ((x1 - x0) || 1)) * W, Y = v => H - ((v - y0) / ((y1 - y0) || 1)) * H;
  const line = pts.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ");
  const last = pts[pts.length - 1][1];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:90px"><line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="currentColor" stroke-opacity=".2"/>
    <polyline points="${line}" fill="none" stroke="${last >= 0 ? "#3fb950" : "#f85149"}" stroke-width="2"/></svg>`;
}

    ${bookCard(A)}
    <div class="card agcard"><div class="row"><b>🧪 Auto PAPER by tier</b><span class="sp"></span><span class="stage">${au.enabled ? "auto on" : "auto off"}</span></div>
      <table class="agt"><tr class="mut"><td>Tier</td><td>Size</td><td>Trades</td><td>Open</td><td>Win</td><td>P&amp;L</td></tr>${au.tiers.map(b => `<tr><td>${esc(b.tier)}</td><td>$${au.rules.sizes[b.tier]}</td><td>${b.trades}</td><td>${b.open}</td><td>${b.win_rate != null ? Math.round(b.win_rate * 100) + "%" : "–"}</td><td class="${cls(b.pnl)}">${usd(b.pnl, 1)}</td></tr>`).join("")}</table>
      <p class="sm mut">Simulated with slippage + FOMO fees. Sells ${au.rules.tp_sell_pct}% at +${au.rules.tp_pct}%, trails the rest ${au.rules.trail_pct}%, stop -${au.rules.stop_pct}%, rug exit at liquidity -${au.rules.liq_drop_pct}%, max ${au.rules.max_hold_h} h, ${au.rules.max_per_day}/day.</p></div>
    <div class="card agcard"><div class="row"><b>Top 30 × 3 platforms (${A.traders.length} wallets)</b><span class="sp"></span>
      <button class="btn ${agSort === "pnl" ? "" : "ghost"}" data-sort="pnl">PnL</button><button class="btn ${agSort === "cons" ? "" : "ghost"}" data-sort="cons" style="margin-left:.3rem">Consistency</button></div>
      <div class="sm mut" style="margin:.3rem 0">${Object.entries(PLAT_C).map(([k, c]) => `<span class="pdot" style="background:${c}"></span>${k}`).join(" · ")} · ◆ on several boards · <span class="pulse"></span> bought in the last 15 min · tap a trader</div>
      ${tradersChart(A.traders)}</div>`;
  }
  wireAgents(el);
  if (keep) window.scrollTo(0, y);
  tickUpd();
}
function wireAgents(el) {
  el.querySelectorAll("[data-trader]").forEach(n => n.onclick = () => { agSel = { t: "trader", id: n.dataset.trader }; show("agents"); });
  el.querySelectorAll("[data-coin]").forEach(n => { if (isMint(n.dataset.coin)) n.onclick = ev => { if (ev.target.closest("a,button")) return; openCoin(n.dataset.coin); }; });
  el.querySelectorAll("[data-sort]").forEach(n => n.onclick = () => { agSort = n.dataset.sort; renderAgents(true); });
  const b = $("agBack"); if (b) b.onclick = () => { const back = agSel && agSel.from; agSel = null; show(back || "agents"); };
  const c = $("agCopy"); if (c) c.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(c.dataset.w).then(() => c.textContent = "Copied ✓"); };
  if (agSel && agSel.t === "trader") {
    const t = (D.agentsx || {}).traders && D.agentsx.traders.find(x => x.wallet === agSel.id);
    if (t) fillTraderLinks(t);
  }
}
function tickUpd() {
  const cu = $("coinUpd"); if (cu && coinSel) { const L = LIVE[coinSel] || {}; cu.textContent = `price ${L.ts ? agoS(L.ts) : "loading…"} · holders ${L.rcTs ? agoS(L.rcTs) : "loading…"} · data ${agoS((D.agentsx || {}).ts || D.ts)}`; }
  const u = $("agUpd"); if (!u || !D) return;
  u.textContent = `data ${agoS((D.agentsx || {}).ts || D.ts)} · prices ${liveTs ? agoS(liveTs) : "loading…"}`;
}

function renderRace() {
  const el = $("v-race"), A = D.agentsx;
  if (!A || !A.race.frames.length) { el.innerHTML = `<div class="card mut">No race data.</div>`; return; }
  const byW = Object.fromEntries(A.traders.map(t => [t.wallet, t]));
  el.innerHTML = `<div class="card agcard"><div class="row"><b>🏁 Trader race · realized PnL</b><span class="sp"></span><button class="btn ghost" id="raceBtn">${raceSt.play ? "Pause" : "Play"}</button></div>
    <div class="sm mut">${A.traders.length} wallets from the FOMO, GMGN and pump.fun top 30 boards · cumulative realized PnL per month (GMGN wallet history) · tap a bar</div>
    <div class="row"><b id="raceM" style="font-size:2rem"></b><span class="sp"></span><input type="range" id="raceR" min="0" max="${A.race.frames.length - 1}" value="${raceSt.i}" style="width:55%"></div>
    <div id="raceBars" style="position:relative;height:${12 * 30}px"></div>
    <div class="sm mut">${Object.entries(PLAT_C).map(([k, c]) => `<span class="pdot" style="background:${c}"></span>${k}`).join(" · ")} · <span class="pulse"></span> live: bought in the last 15 min</div></div>`;
  const bars = $("raceBars"), now = Date.now() / 1000, nodes = {};
  const draw = () => {
    const f = A.race.frames[raceSt.i], mx = Math.max(...f.top.map(v => Math.abs(v.v)), 1);
    $("raceM").textContent = f.m; $("raceR").value = raceSt.i;
    const keep = new Set();
    f.top.slice(0, 12).forEach((v, i) => {
      const t = byW[v.w] || { handle: v.w.slice(0, 4), platforms: [] }; keep.add(v.w);
      let n = nodes[v.w];
      if (!n) { n = document.createElement("div"); n.className = "rbar tap"; n.dataset.trader = v.w; n.innerHTML = `<span class="rb"></span><span class="rl"></span>`; bars.appendChild(n); nodes[v.w] = n;
        n.onclick = () => { agSel = { t: "trader", id: v.w, from: "race" }; show("agents"); }; }
      n.style.transform = `translateY(${i * 30}px)`; n.style.opacity = 1;
      const b = n.querySelector(".rb"); b.style.width = Math.max(2, Math.abs(v.v) / mx * 70) + "%"; b.style.background = v.v < 0 ? "#ff5468" : PLAT_C[t.platforms[0]] || "#888";
      n.querySelector(".rl").innerHTML = `${platDots(t.platforms)}${esc(t.handle)} <b>${kusd(v.v)}</b>${t.last_buy && now - t.last_buy < 900 ? `<span class="pulse"></span>` : ""}`;
    });
    for (const [w, n] of Object.entries(nodes)) if (!keep.has(w)) { n.style.opacity = 0; n.style.transform = `translateY(${12 * 30}px)`; }
  };
  draw();
  $("raceR").oninput = e => { raceSt.i = +e.target.value; draw(); };
  $("raceBtn").onclick = () => { raceSt.play = !raceSt.play; $("raceBtn").textContent = raceSt.play ? "Pause" : "Play"; };
  clearInterval(raceSt.timer);
  raceSt.timer = setInterval(() => { if (view !== "race" || !raceSt.play) return; raceSt.i = (raceSt.i + 1) % A.race.frames.length; draw(); }, 1400);
}

  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === v));

document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => show(b.dataset.v));

// swipe between coins on the Auditor screen (never when gesture starts on the chart)
let sx = null, sy = null, swipeFromChart = false;
$("v-audit").addEventListener("touchstart", e => {
  swipeFromChart = !!(e.target && e.target.closest && e.target.closest(".mc-chart-wrap, .live-chart, .chart-fs, iframe"));

}, { passive: true });

// ---------- phone alerts (Web Push) ----------
// The box cannot receive anything, so after subscribing the app shows a one-line code that Mike sends to the
// desk Telegram bot (/push DP1.…). The code is the subscription encrypted with the app token
// (PBKDF2-SHA256 210k + AES-GCM, AAD "desk:push"), so only this desk's app can register a phone.
const pushOK = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
let swReg = null, pushCode = localStorage.getItem("desk_push_code");
async function registerSW() {
  if (!("serviceWorker" in navigator)) return null;
  try {
    swReg = await navigator.serviceWorker.register("sw.js?v=19", { scope: "./" });
    if (swReg && swReg.update) swReg.update().catch(() => {});
    // New SW takes control → reload once so the PWA drops a blank half-cached shell.
    let refreshing = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (refreshing) return; refreshing = true; location.reload();
    });
  } catch (e) { console.error(e); }
  return swReg;
}
const b64u = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const b64uDec = s => b64d(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));
async function makePushCode(sub, token) {
  const j = sub.toJSON(), salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(token), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt, iterations: 210000 },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
  const pt = new TextEncoder().encode(JSON.stringify({ e: j.endpoint, p: j.keys.p256dh, a: j.keys.auth }));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: new TextEncoder().encode("desk:push") }, key, pt));
  const all = new Uint8Array(28 + ct.length); all.set(salt); all.set(iv, 16); all.set(ct, 28);
  return "DP1." + b64u(all);
}
function alertsHtml() {
  const q = (D && D.push && D.push.quiet) || "23:00-07:00";
  if (!pushOK()) return `<b>Phone alerts</b><p class="sm mut">This browser can't receive alerts. On Android use Chrome and add the app to the Home screen.</p>`;
  const perm = Notification.permission;
  const head = `<div class="row"><b>Phone alerts</b><span class="sp"></span><span class="sm mut">${D && D.push ? D.push.devices + " device(s) registered" : ""}</span></div>`;
  const quiet = `<p class="sm mut">Quiet hours ${esc(q)}: only stop-loss, desk-locked and market-danger alerts come through at night; the rest arrive in the morning.</p>`;
  if (perm === "denied") return head + `<p class="sm red">Notifications are blocked for this site. Allow them in Chrome's site settings, then come back.</p>` + quiet;
  if (pushCode) return head + `<p class="sm">Send this whole line to your desk bot in Telegram (one time per phone):</p>
    <textarea id="pushCode" readonly rows="4" style="width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:.5rem;font:12px ui-monospace,monospace">/push ${esc(pushCode)}</textarea>
    <div class="row" style="gap:.4rem;margin-top:.4rem"><button class="btn" id="copyPush">Copy</button><button class="btn ghost" id="offPush">Turn off</button>
    <span class="sm mut" id="copyMsg"></span></div>` + quiet;
  return head + `<p class="sm mut">Get buy, stop-loss, take-profit and desk alerts on this phone.</p>
    <button class="btn" id="onPush">Enable alerts</button> <span class="sm red" id="pushErr"></span>` + quiet;
}
function bindAlerts() {
  const on = $("onPush"), copy = $("copyPush"), off = $("offPush");
  if (on) on.onclick = enableAlerts;
  if (copy) copy.onclick = async () => { try { await navigator.clipboard.writeText($("pushCode").value); $("copyMsg").textContent = "Copied"; }
    catch (e) { $("pushCode").select(); $("copyMsg").textContent = "Select and copy"; } };
  if (off) off.onclick = async () => { const r = swReg || await registerSW(); const s = r && await r.pushManager.getSubscription();
    if (s) await s.unsubscribe(); localStorage.removeItem("desk_push_code"); pushCode = null; renderHome(); };
}
async function enableAlerts() {
  const err = m => { const el = $("pushErr"); if (el) el.textContent = m; };
  try {
    if (!D || !D.push || !D.push.key) return err("The desk hasn't published its alert key yet.");
    if (await Notification.requestPermission() !== "granted") return renderHome();
    const reg = swReg || await registerSW(); if (!reg) return err("Could not start the alert worker.");
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uDec(D.push.key) });
    pushCode = await makePushCode(sub, deskToken()); localStorage.setItem("desk_push_code", pushCode); renderHome();
  } catch (e) { console.error(e); err("Could not enable alerts: " + e.message); }
}

async function refresh() {
  try {
    const prev = D && D.agentsx;
    D = await load("desk");
    try { D.agentsx = await load("agents"); } catch (e) { D.agentsx = prev || null; }
    renderHeader();
    if (view === "agents") renderAgents(true);
    else if (view === "coin") renderCoin();           // renderCoin parks/reuses chart
    else if (view === "audit") renderAudit(false);    // soft when chart hold; never kills iframe
    else if (view !== "race") show(view);
    fetchLive();
  } catch (e) {
    if (!D) { $("lock").style.display = "block"; $("app").style.display = "none";
      $("lockmsg").textContent = "Cannot open the desk data - wrong or missing token. Open your secret desk link again."; }
    else $("upd").innerHTML = `<span class="red">Update failed · showing data from ${ago(D.ts)}</span>`;
    console.error(e);
  }
}

if (!deskToken()) { $("lock").style.display = "block"; $("app").style.display = "none"; $("tabs").style.display = "none"; $("upd").textContent = ""; }
else { registerSW(); show(view); refresh(); setInterval(refresh, 30000); setInterval(() => D && renderHeader(), 30000); }
