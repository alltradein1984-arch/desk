<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#07090c">
<title>Desk</title>
<script>
// set the theme before first paint (no dark flash at night); full logic + toggle is at the bottom
(function () { try {
  const p = localStorage.getItem("desk_theme") || "auto";
  const h = +new Intl.DateTimeFormat("en-GB", { hour: "2-digit", hourCycle: "h23", timeZone: "Europe/Amsterdam" }).format(new Date());
  document.documentElement.dataset.theme = p === "light" || p === "dark" ? p : (h >= 22 || h < 7 ? "light" : "dark");
} catch (e) {} })();
</script>

<style>
:root{--bg:#07090c;--card:#11151b;--card2:#171c24;--line:#232a35;--txt:#e9edf2;--mut:#8a94a3;--grn:#2fd27a;--red:#ff5468;--amb:#ffb648;--blu:#5aa9ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;background:rgba(7,9,12,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:1.1rem;letter-spacing:.05em}
header .upd{margin-left:auto;color:var(--mut);font-size:.8rem;text-align:right}
.badge{font-size:.7rem;font-weight:700;padding:.15rem .5rem;border-radius:99px;letter-spacing:.06em}
.b-paper{background:#2a2410;color:var(--amb);border:1px solid #5a4614}.b-live{background:#2a1015;color:var(--red);border:1px solid #5a1a24}
main{max-width:1280px;margin:0 auto;padding:1rem}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem;margin-bottom:.9rem}
.mut{color:var(--mut)}.sm{font-size:.82rem}.grn{color:var(--grn)}.red{color:var(--red)}.amb{color:var(--amb)}
.big{font-size:2rem;font-weight:700;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:.6rem}.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.kv{background:var(--card2);border-radius:12px;padding:.6rem .7rem}.kv b{display:block;font-size:1.05rem}
.banner{border-radius:14px;padding:.75rem .9rem;margin-bottom:.7rem;font-weight:600}
.bn-red{background:#2a0f15;border:1px solid #5c1d29;color:#ffb3bd}.bn-amb{background:#2a200d;border:1px solid #5a4614;color:#ffd59a}

.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.8rem}

.dots i{width:7px;height:7px;border-radius:50%;background:#2c3542}.dots i.on{background:var(--txt)}.dots i.r{box-shadow:inset 0 0 0 2px var(--red)}.dots i.g{box-shadow:inset 0 0 0 2px var(--grn)}

.st-vetoed,.st-blocked,.st-rugged{background:#3a121a;color:var(--red)}

.st-held,.st-approved,.st-cleared,.st-candidate{background:#123524;color:var(--grn)}.st-rejected,.st-reject{background:#3a121a;color:var(--red)}.st-wait,.st-scored{background:#2a2410;color:var(--amb)}

html[data-theme="light"] .p-bad,html[data-theme="light"] .ic-bad,html[data-theme="light"] .st-rejected,html[data-theme="light"] .st-reject{background:#ffe8eb;border-color:#f5b5bf}
html[data-theme="light"] .st-wait,html[data-theme="light"] .st-scored{background:#fff2d9}
html[data-theme="light"] .stage,html[data-theme="light"] .ic-na{background:#e8ecf1}
html[data-theme="light"] .st-vetoed,html[data-theme="light"] .st-blocked,html[data-theme="light"] .st-rugged,html[data-theme="light"] .score.lo{background:#ffe8eb}
html[data-theme="light"] .score.hi{background:#e2f6ea}
html[data-theme="light"] .st-watch{background:#e3efff;color:#1a4f93}html[data-theme="light"] .addrow input{background:#fff}
html[data-theme="light"] .chk.bad .val{color:#c0283d}
html[data-theme="light"] .v-ok{background:linear-gradient(90deg,#dcf5e7,#effaf4);border-color:#a9e2c2;color:#0b6b3b}
html[data-theme="light"] .v-bad{background:linear-gradient(90deg,#ffe1e6,#fff1f3);border-color:#f5b5bf;color:#9b1c2e}
html[data-theme="light"] .dots i{background:#cfd6df}
html[data-theme="light"] .btn{color:#fff}html[data-theme="light"] .btn.ghost{color:var(--txt)}
#theme{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:99px;font-size:.72rem;padding:.2rem .6rem;cursor:pointer}
#lock{display:none;text-align:center;padding:4rem 1rem}
.split-trades{display:none}
@media (min-width:960px){
  body{padding-bottom:0}
  nav.tabs{position:sticky;top:53px;bottom:auto;justify-content:center;border-top:0;border-bottom:1px solid var(--line);background:var(--bg)}
  nav.tabs button{flex:none;width:120px;flex-direction:row;justify-content:center;gap:.4rem;font-size:.85rem;padding:.7rem 0}
  nav.tabs button svg{width:18px;height:18px}
  .split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:1rem;align-items:start}
  .split-trades{display:block}
  #v-home .homegrid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:start}
}

<body>
<header>
  <h1>DESK</h1><span id="mode" class="badge b-paper">…</span>
  <div class="upd" id="upd">Loading…</div>
  <button id="theme" title="Theme: Auto = light 22:00-07:00, dark in the day">Auto</button>
</header>
<nav class="tabs" id="tabs">
  <button data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-v="audit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>Auditor</button>
  <button data-v="coins"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="6"/><path d="M15.5 9.5a6 6 0 1 1-6 6"/></svg>Coins</button>
  <button data-v="trades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Trades</button>

  <button data-v="events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Events</button>
</nav>
<div id="lock"><h2>Locked</h2><p class="mut" id="lockmsg">Open your secret desk link (the one ending in #t=…) once on this device.</p></div>
<main id="app">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-audit"><div class="split"><div id="auditPane"></div><div class="split-trades" id="splitTrades"></div></div></section>
  <section class="view" id="v-coins"></section>
  <section class="view" id="v-trades"></section>
  <section class="view" id="v-whales"></section>

</main>
<script>
// Token comes from the URL fragment (#t=...), which browsers never send to the server.
// It is kept in localStorage and removed from the address bar.
(function () {
  const KEY = "desk_app_token";
  const m = location.hash.match(/(?:^#|&)t=([^&]+)/);
  if (m) {
    localStorage.setItem(KEY, decodeURIComponent(m[1]));
    history.replaceState(null, "", location.pathname + location.search);
  }
  window.deskToken = () => localStorage.getItem(KEY);
})();

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function gunzip(buf) {
  const ds = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Uint8Array(await new Response(ds).arrayBuffer());
}

async function decryptEnvelope(env, token) {
  if (![1, 2].includes(env.v) || env.alg !== "AES-256-GCM" || env.kdf !== "PBKDF2-SHA256") throw new Error("unsupported envelope");
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(token), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt: b64d(env.salt), iterations: env.iter },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  let pt = new Uint8Array(await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64d(env.iv), additionalData: new TextEncoder().encode(env.aad || "") },
    key, b64d(env.ct)));
  if (env.z === "gzip") pt = await gunzip(pt);
  return JSON.parse(new TextDecoder().decode(pt));
}

// GitHub Pages' CDN caches files for up to 10 min; the ?ts= query makes every fetch a fresh URL.
async function load(name) {
  const r = await fetch(`data/${name}.enc.json?ts=${Date.now()}`, { cache: "no-store" });
  if (!r.ok) throw new Error(`fetch ${name}: HTTP ${r.status}`);
  return decryptEnvelope(await r.json(), deskToken());
}


// ---------- theme: Auto (default) = LIGHT 22:00-07:00 Europe/Amsterdam, DARK otherwise; or fixed Dark / Light ----------
const THEME_KEY = "desk_theme", THEMES = ["auto", "dark", "light"];
const LIGHT_FROM = 22, LIGHT_UNTIL = 7;
function amsterdamHour(d = new Date()) {
  try { return +new Intl.DateTimeFormat("en-GB", { hour: "2-digit", hourCycle: "h23", timeZone: "Europe/Amsterdam" }).format(d); }
  catch (e) { return d.getHours(); }      // fallback: device clock
}
function autoTheme(d) { const h = amsterdamHour(d); return (h >= LIGHT_FROM || h < LIGHT_UNTIL) ? "light" : "dark"; }
function applyTheme() {
  let pref = localStorage.getItem(THEME_KEY); if (!THEMES.includes(pref)) pref = "auto";
  const t = pref === "auto" ? autoTheme() : pref;
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "light" ? "#f4f6f9" : "#07090c");
  const b = document.getElementById("theme");
  if (b) b.textContent = pref === "auto" ? `Auto · ${t === "light" ? "Light" : "Dark"}` : (pref === "light" ? "Light" : "Dark");
}
applyTheme();
setInterval(applyTheme, 60000);          // Auto flips at 22:00 / 07:00 without a reload
document.getElementById("theme").onclick = () => {
  const cur = THEMES.includes(localStorage.getItem(THEME_KEY)) ? localStorage.getItem(THEME_KEY) : "auto";
  localStorage.setItem(THEME_KEY, THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length]); applyTheme();
};

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => (typeof u === "string" && /^https:\/\/[^\s"'<>]+$/.test(u)) ? u : null;
const usd = (x, sign) => x == null ? "–" : (sign && x > 0 ? "+" : x < 0 ? "-" : "") + "$" + Math.abs(x).toFixed(2);
const pct = x => x == null ? "–" : (x > 0 ? "+" : "") + x.toFixed(1) + "%";
const cls = x => x == null ? "" : x > 0 ? "grn" : x < 0 ? "red" : "";
const px = x => x == null ? "–" : "$" + (x >= 1 ? x.toFixed(4) : x.toPrecision(4));
const ago = ts => { const m = Math.max(0, (Date.now() / 1000 - ts) / 60); return m < 1 ? "just now" : m < 60 ? `${Math.round(m)} min ago` : m < 2880 ? `${(m / 60).toFixed(1)} h ago` : `${Math.round(m / 1440)} d ago`; };
const tm = ts => ts ? new Date(ts * 1000).toLocaleString([], { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "–";
const shortMint = m => m ? m.slice(0, 4) + "…" + m.slice(-4) : "";
const initials = s => esc((s || "?").replace(/[^A-Za-z0-9]/g, "").slice(0, 2).toUpperCase() || "?");
function logo(c, extra = "") {
  const u = safeUrl(c.image);
  return `<div class="logo ${extra}">${u ? `<img src="${esc(u)}" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.textContent='${initials(c.sym)}'">` : initials(c.sym)}</div>`;
}
// the link is used exactly as delivered in the feed (built by links.py on the box)
function fomoBtn(link, ghost) {
  const u = safeUrl(link);
  return u ? `<a class="btn${ghost ? " ghost" : ""}" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Open on FOMO</a>` : "";
}
// DexScreener chart: the feed's chart_url, used as given; only https://dexscreener.com/... is accepted
function chartBtn(u) {
  return (typeof u === "string" && /^https:\/\/dexscreener\.com\/[A-Za-z0-9\/]+$/.test(u))
    ? `<a class="btn ghost" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Open chart</a>` : "";
}
const STALE_MIN = 20;
let D = null, view = localStorage.getItem("desk_view") || "home", aIdx = 0;

// ---------- screens ----------
function renderHeader() {
  const s = D.state, mode = s.mode === "LIVE" ? "LIVE" : "PAPER";
  $("mode").textContent = mode; $("mode").className = "badge " + (mode === "LIVE" ? "b-live" : "b-paper");
  const old = (Date.now() / 1000 - D.ts) / 60 > STALE_MIN;
  $("upd").innerHTML = `<span class="${old ? "red" : ""}">Updated ${ago(D.ts)}</span>`;
}

function morningHtml() {
  const m = D.morning;
  if (!m) return `<div class="card" id="morning"><b>Morning page</b><p class="sm mut" style="margin-top:.3rem">The first morning report arrives after the next 08:00 run.</p></div>`;
  const coinA = c => { const u = safeUrl(c.link); return u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(c.sym)}</a>` : esc(c.sym); };
  const passes = (m.passes || []).map(c => `<li>✅ ${coinA(c)} <span class="mut">score ${c.trade_score == null ? "–" : Math.round(c.trade_score)}</span></li>`).join("")
    || `<li class="mut">No coin passed every check.</li>`;
  const blocked = (m.blocked || []).slice(0, 5).map(c => `<li>⛔ ${coinA(c)} <span class="mut">${esc(c.reason)}</span>${c.later_pct == null ? "" : ` <span class="${cls(c.later_pct)}">later ${pct(c.later_pct)}</span>`}</li>`).join("")
    || `<li class="mut">Nothing blocked.</li>`;
  return `<div class="card" id="morning"><div class="row"><b>☀️ Morning page${m.test ? " (TEST)" : ""}</b><span class="sp"></span><span class="sm mut">${tm(m.ts)}</span></div>
    <div class="grid2" style="margin-top:.5rem">
      <div class="kv"><span class="mut sm">Stack (${esc(m.mode)})</span><b>${usd(m.equity)}</b></div>

// Step 9: "Add coin" box -> Telegram deep link https://t.me/Alltradein_bot?start=add_<CA> (the bot runs /add).
// The CA is checked here first: base58 alphabet, 32-44 chars, decodes to exactly 32 bytes.
const BOT = "Alltradein_bot", B58A = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function b58len(s) {
  const b = [0];
  for (const ch of s) {
    let carry = B58A.indexOf(ch); if (carry < 0) return -1;
    for (let i = 0; i < b.length; i++) { carry += b[i] * 58; b[i] = carry & 255; carry >>= 8; }
    while (carry) { b.push(carry & 255); carry >>= 8; }
  }
  while (b.length && b[b.length - 1] === 0) b.pop();
  let z = 0; for (const ch of s) { if (ch === "1") z++; else break; }
  return z + b.length;
}
function validCA(s) { return typeof s === "string" && /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(s) && b58len(s) === 32; }
function addCoinLink(ca) { ca = String(ca ?? "").trim(); return validCA(ca) ? `https://t.me/${BOT}?start=add_${ca}` : null; }
function addBoxHtml() {

}
function wireAddBox() {

function eqSvg(pts) {
  if (!pts || pts.length < 2) return `<p class="sm mut">Curve starts after the first copied sells.</p>`;
  const W = 320, H = 90, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]).concat([0]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1, y0 = Math.min(...ys), y1 = Math.max(...ys);
  const X = t => ((t - x0) / ((x1 - x0) || 1)) * W, Y = v => H - ((v - y0) / ((y1 - y0) || 1)) * H;
  const line = pts.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ");
  const last = pts[pts.length - 1][1];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:90px"><line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="currentColor" stroke-opacity=".2"/>
    <polyline points="${line}" fill="none" stroke="${last >= 0 ? "#3fb950" : "#f85149"}" stroke-width="2"/></svg>`;
}

async function registerSW() {
  if (!("serviceWorker" in navigator)) return null;
  try { swReg = await navigator.serviceWorker.register("sw.js", { scope: "./" }); } catch (e) { console.error(e); }
  return swReg;
}
const b64u = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const b64uDec = s => b64d(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));
async function makePushCode(sub, token) {
  const j = sub.toJSON(), salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(token), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt, iterations: 210000 },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
  const pt = new TextEncoder().encode(JSON.stringify({ e: j.endpoint, p: j.keys.p256dh, a: j.keys.auth }));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: new TextEncoder().encode("desk:push") }, key, pt));
  const all = new Uint8Array(28 + ct.length); all.set(salt); all.set(iv, 16); all.set(ct, 28);
  return "DP1." + b64u(all);
}
function alertsHtml() {
  const q = (D && D.push && D.push.quiet) || "23:00-07:00";
  if (!pushOK()) return `<b>Phone alerts</b><p class="sm mut">This browser can't receive alerts. On Android use Chrome and add the app to the Home screen.</p>`;
  const perm = Notification.permission;
  const head = `<div class="row"><b>Phone alerts</b><span class="sp"></span><span class="sm mut">${D && D.push ? D.push.devices + " device(s) registered" : ""}</span></div>`;
  const quiet = `<p class="sm mut">Quiet hours ${esc(q)}: only stop-loss, desk-locked and market-danger alerts come through at night; the rest arrive in the morning.</p>`;
  if (perm === "denied") return head + `<p class="sm red">Notifications are blocked for this site. Allow them in Chrome's site settings, then come back.</p>` + quiet;
  if (pushCode) return head + `<p class="sm">Send this whole line to your desk bot in Telegram (one time per phone):</p>
    <textarea id="pushCode" readonly rows="4" style="width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:.5rem;font:12px ui-monospace,monospace">/push ${esc(pushCode)}</textarea>
    <div class="row" style="gap:.4rem;margin-top:.4rem"><button class="btn" id="copyPush">Copy</button><button class="btn ghost" id="offPush">Turn off</button>
    <span class="sm mut" id="copyMsg"></span></div>` + quiet;
  return head + `<p class="sm mut">Get buy, stop-loss, take-profit and desk alerts on this phone.</p>
    <button class="btn" id="onPush">Enable alerts</button> <span class="sm red" id="pushErr"></span>` + quiet;
}
function bindAlerts() {
  const on = $("onPush"), copy = $("copyPush"), off = $("offPush");
  if (on) on.onclick = enableAlerts;
  if (copy) copy.onclick = async () => { try { await navigator.clipboard.writeText($("pushCode").value); $("copyMsg").textContent = "Copied"; }
    catch (e) { $("pushCode").select(); $("copyMsg").textContent = "Select and copy"; } };
  if (off) off.onclick = async () => { const r = swReg || await registerSW(); const s = r && await r.pushManager.getSubscription();
    if (s) await s.unsubscribe(); localStorage.removeItem("desk_push_code"); pushCode = null; renderHome(); };
}
async function enableAlerts() {
  const err = m => { const el = $("pushErr"); if (el) el.textContent = m; };
  try {
    if (!D || !D.push || !D.push.key) return err("The desk hasn't published its alert key yet.");
    if (await Notification.requestPermission() !== "granted") return renderHome();
    const reg = swReg || await registerSW(); if (!reg) return err("Could not start the alert worker.");
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uDec(D.push.key) });
    pushCode = await makePushCode(sub, deskToken()); localStorage.setItem("desk_push_code", pushCode); renderHome();
  } catch (e) { console.error(e); err("Could not enable alerts: " + e.message); }
}

async function refresh() {
  try {
    D = await load("desk");
    renderHeader(); show(view);
  } catch (e) {
    if (!D) { $("lock").style.display = "block"; $("app").style.display = "none";
      $("lockmsg").textContent = "Cannot open the desk data - wrong or missing token. Open your secret desk link again."; }
    else $("upd").innerHTML = `<span class="red">Update failed · showing data from ${ago(D.ts)}</span>`;
    console.error(e);
  }
}

if (!deskToken()) { $("lock").style.display = "block"; $("app").style.display = "none"; $("tabs").style.display = "none"; $("upd").textContent = ""; }
else { registerSW(); show(view); refresh(); setInterval(refresh, 60000); setInterval(() => D && renderHeader(), 30000); }
</script>
